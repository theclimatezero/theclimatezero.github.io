.detail-cell .dv{font-size:15px;font-weight:600;color:#1a1a18}

.tooltip .t-name{font-weight:500;font-size:13px;margin-bottom:2px;color:#1a1a18}
.tooltip .t-val{color:#777}

.no-data{fill:#e4e2dc}

.graticule{fill:none;stroke:#c0d4e0;stroke-width:0.3}
.country-path{stroke:#fff;stroke-width:0.4;cursor:pointer;transition:opacity 0.12s ease,stroke-width 0.12s ease}

 the earlier net zero targets among major economies.","deaths":"39,017","deathsSrc":"WHO, 2021","pm25nat":"9.4","pm25natSrc":"IQAir, 2025 national average"},"IND":{"name":"India","page":"country-india.html","share":"8%","historical":"3.5%","gdpLoss":"1.5 to 2%","status":"Massive solar expansion and among the cheapest solar power in the world. Coal still dominates and emissions rise with growth, but emissions per person remain far below Western levels. Highly exposed to heat and floods.","deaths":"936,093","deathsSrc":"WHO, 2021","city":"Loni","pm25":"112.5","citySrc":"IQAir, 2025"},"IDN":{"name":"Indonesia","page":"country-indonesia.html","co2":"0.47 Gt","share":"1.3%","historical":"1.2%","renewable":"19%","gdpLoss":"1 to 2% GDP","status":"Coal supplies about 60 percent of electricity and deforestation remains significant, factors that worsened the deadly December 2025 floods. A 20 billion dollar Just Energy Transition Partnership targets its coal fleet.","deaths":"103,142","deathsSrc":"WHO, 2021","city":"South Tangerang","pm25":"51.5","citySrc":"IQAir, 2025"},"ITA":{"name":"Italy","page":"country-italy.html","co2":"0.31 Gt","share":"0.85%","historical":"2%","renewable":"39%","gdpLoss":"0.3% GDP","status":"Strong solar base and a coal phase out nearly complete. The Mediterranean region is a climate hotspot, exposing Italy to severe heat, drought and flooding.","deaths":"30,265","deathsSrc":"WHO, 2021"},"JPN":{"name":"Japan","page":"country-japan.html","co2":"1.0 Gt","share":"3%","historical":"4%","renewable":"24%","gdpLoss":"0.4% GDP","status":"Emissions are declining and solar has expanded significantly, but Japan remains heavily reliant on imported coal and gas. Its hydrogen investment is world leading.","deaths":"50,584","deathsSrc":"WHO, 2021"},"KEN":{"name":"Kenya","page":"country-kenya.html","co2":"0.02 Gt","share":"0.06%","historical":"0.1%","renewable":"90%","gdpLoss":"2 to 4% GDP","status":"About 90 percent renewable electricity, led by world class geothermal. One of the cleanest grids anywhere, in a country facing severe recurring drought it did almost nothing to cause.","deaths":"8,792","deathsSrc":"WHO, 2021","city":"Kisumu","pm25":"18.5","citySrc":"IQAir, 2025"},"MEX":{"name":"Mexico","page":"country-mexico.html","co2":"0.43 Gt","share":"1.2%","historical":"1.3%","renewable":"25%","gdpLoss":"0.5% GDP","status":"Large untapped solar and wind potential. October 2025 floods killed at least 66 people and damaged over 16,000 homes across five states. Targets are widely judged insufficient.","deaths":"36,305","deathsSrc":"WHO, 2021"},"MAR":{"name":"Morocco","page":"country-morocco.html","co2":"0.075 Gt","share":"0.2%","historical":"0.1%","renewable":"38%","gdpLoss":"0.5 to 1% GDP","status":"Home to some of the world's largest solar complexes and among the most ambitious climate plans in Africa. December 2025 flash floods in Safi killed at least 37 people.","deaths":"17,606","deathsSrc":"WHO, 2021"},"NLD":{"name":"Netherlands","page":"country-netherlands.html","co2":"0.13 Gt","share":"0.4%","historical":"1%","renewable":"48%","gdpLoss":"0.5% GDP","status":"Rapid offshore wind growth has lifted renewables to nearly half of generation. As a low lying nation it faces existential sea level exposure despite its wealth.","deaths":"4,781","deathsSrc":"WHO, 2021"},"NGA":{"name":"Nigeria","page":"country-nigeria.html","co2":"0.13 Gt","share":"0.35%","historical":"0.5%","renewable":"19%","gdpLoss":"1 to 2% GDP","status":"Africa's largest economy faces drought in the north and flooding in the south. Off grid solar is expanding fast, but the economy remains oil dependent.","deaths":"106,962","deathsSrc":"WHO, 2021","city":"Port Harcourt","pm25":"13.0","citySrc":"IQAir, 2025"},"NOR":{"name":"Norway","page":"country-norway.html","co2":"0.037 Gt","share":"0.1%","historical":"0.3%","renewable":"98%","gdpLoss":"0.1% GDP","status":"Nearly all electricity is renewable and EV adoption is the highest in the world. But Norway is also one of the largest oil and gas exporters, a contradiction at the heart of its climate record.","deaths":"730","deathsSrc":"WHO, 2021"},"PAK":{"name":"Pakistan","page":"country-pakistan.html","co2":"0.24 Gt","share":"0.65%","historical":"0.4%","renewable":"33%","gdpLoss":"3 to 5% GDP in flood years","status":"Emits under one percent of global CO2 yet suffers some of the worst climate impacts on Earth, from the 2022 floods to repeated extreme heat. A frontline case for loss and damage finance.","deaths":"118,647","deathsSrc":"WHO, 2021","city":"Faisalabad","pm25":"98.8","citySrc":"IQAir, 2025"},"PHL":{"name":"Philippines","page":"country-philippines.html","co2":"0.15 Gt","share":"0.4%","historical":"0.3%","renewable":"31%","gdpLoss":"1 to 3% GDP","status":"Sits in the world's most active typhoon corridor. Super Typhoon Fung-wong displaced over a million people in November 2025. Consistently among the most climate vulnerable nations despite minimal emissions.","deaths":"60,974","deathsSrc":"WHO, 2021","city":"Pasay","pm25":"42.0","citySrc":"IQAir, 2025"},"POL":{"name":"Poland","page":"country-poland.html","co2":"0.29 Gt","share":"0.8%","historical":"2%","renewable":"27%","gdpLoss":"0.2% GDP","status":"Still the most coal reliant large economy in Europe, though solar has grown quickly. Frequently resists stronger EU climate ambition.","deaths":"35,297","deathsSrc":"WHO, 2021"},"RUS":{"name":"Russia","page":"country-russia.html","co2":"1.9 Gt","share":"5%","historical":"7%","renewable":"20%","gdpLoss":"0.3% GDP","status":"The world's second largest fossil fuel exporter with weak, largely unenforced climate targets and minimal renewable investment outside hydropower.","deaths":"98,014","deathsSrc":"WHO, 2021"},"SAU":{"name":"Saudi Arabia","page":"country-saudiarabia.html","co2":"0.51 Gt","share":"1.4%","historical":"1.1%","renewable":"1%","gdpLoss":"0.2% GDP","status":"The world's largest oil exporter and among the highest emitters per person. Renewable projects exist under Vision 2030, but largely to free up oil for export.","deaths":"5,301","deathsSrc":"WHO, 2021"},"ZAF":{"name":"South Africa","page":"country-southafrica.html","co2":"0.4 Gt","share":"1.1%","historical":"1.3%","renewable":"12%","gdpLoss":"1% GDP","status":"Africa's largest emitter, with about 85 percent coal power and a chronic electricity crisis. The 8.5 billion dollar Just Energy Transition Partnership aims to accelerate its coal exit.","deaths":"20,667","deathsSrc":"WHO, 2021","city":"Umkomaas","pm25":"43.3","citySrc":"IQAir, 2025"},"KOR":{"name":"South Korea","page":"country-southkorea.html","co2":"0.6 Gt","share":"1.7%","historical":"1.4%","renewable":"9%","gdpLoss":"0.3% GDP","status":"A technology powerhouse with one of the lowest renewable shares in the developed world. Heavy reliance on coal and gas persists despite net zero pledges.","deaths":"17,899","deathsSrc":"WHO, 2021","city":"Daegu","pm25":"29.5","citySrc":"IQAir, 2025 (lower confidence)"},"ESP":{"name":"Spain","page":"country-spain.html","co2":"0.22 Gt","share":"0.6%","historical":"1.4%","renewable":"50%","gdpLoss":"0.3% GDP","status":"Half of electricity now comes from renewables and coal has essentially been retired. Also on the front line of European heat, with record May 2026 temperatures.","deaths":"13,030","deathsSrc":"WHO, 2021"},"LKA":{"name":"Sri Lanka","page":"country-srilanka.html","co2":"0.02 Gt","share":"0.06%","historical":"0.05%","renewable":"52%","gdpLoss":"1 to 2% GDP","status":"Cyclone Ditwah killed at least 56 people in late 2025 amid economic crisis. Over half of electricity already comes from renewables, led by hydro.","deaths":"9,674","deathsSrc":"WHO, 2021","city":"Akurana","pm25":"24.0","citySrc":"IQAir, 2025"},"SWE":{"name":"Sweden","page":"country-sweden.html","co2":"0.037 Gt","share":"0.1%","historical":"0.4%","renewable":"69%","gdpLoss":"0.1% GDP","status":"One of the cleanest grids in the world from hydro, wind and nuclear, and among the lowest emitters per person of any developed nation.","deaths":"1,554","deathsSrc":"WHO, 2021"},"THA":{"name":"Thailand","page":"country-thailand.html","co2":"0.28 Gt","share":"0.75%","historical":"0.6%","renewable":"16%","gdpLoss":"1% GDP","status":"December 2025 floods killed at least 276 people across fourteen provinces. Renewable growth is slow and gas dominates the power mix.","deaths":"30,517","deathsSrc":"WHO, 2021","city":"Mae Rim","pm25":"44.7","citySrc":"IQAir, 2025"},"TUR":{"name":"Turkey","page":"country-turkey.html","co2":"0.44 Gt","share":"1.2%","historical":"1.2%","renewable":"42%","gdpLoss":"0.4% GDP","status":"Strong hydro and rapidly growing solar and wind, but coal capacity is still expanding. Exposed to Mediterranean heat and drought.","deaths":"39,835","deathsSrc":"WHO, 2021","city":"Igdir","pm25":"64.4","citySrc":"IQAir, 2025"},"TUV":{"name":"Tuvalu","page":"country-tuvalu.html","co2":"1e-05 Gt","share":"0%","historical":"0%","renewable":"45%","gdpLoss":"Existential","status":"Emits roughly 12,000 tonnes of CO2 a year, essentially zero, yet may become uninhabitable by 2050. Has signed a treaty with Australia to preserve its statehood as its land is lost."},"ARE":{"name":"United Arab Emirates","page":"country-uae.html","co2":"0.24 Gt","share":"0.65%","historical":"0.4%","renewable":"7%","gdpLoss":"0.2% GDP","status":"Hosted COP28 and invests heavily in solar at home, yet remains a major oil exporter with among the highest emissions per person in the world.","deaths":"989","deathsSrc":"WHO, 2021","city":"Ruwais","pm25":"43.3","citySrc":"IQAir, 2025"},"GBR":{"name":"United Kingdom","page":"country-uk.html","co2":"0.3 Gt","share":"0.9%","historical":"4.6%","renewable":"47%","gdpLoss":"0.1% GDP","status":"A world leader in offshore wind with emissions down roughly 50 percent since 1990, and coal power ended in 2024. High historical responsibility as the birthplace of industrialisation.","deaths":"19,798","deathsSrc":"WHO, 2021","pm25nat":"8.7","pm25natSrc":"IQAir, 2025 national average"}, window.addEventListener("resize", () => { wrapRect = mapWrap.getBoundingClientRect(); }, { passive: true });

// Throttle tooltip repositioning to one update per animation frame, and
// move it with a GPU-friendly transform instead of left/top so the
// browser doesn't have to re-layout on every pointer move.
let pendingEvent = null;
let rafScheduled = false;
function flushTooltipPosition() {
  rafScheduled = false;
  if (!pendingEvent) return;
  const tx = Math.min(pendingEvent.clientX - wrapRect.left + 14, wrapRect.width - 170);
  const ty = Math.min(pendingEvent.clientY - wrapRect.top + 14, wrapRect.height - 70);
  tooltip.style.transform = `translate(${tx}px, ${ty}px)`;
}

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
  .then(r=>r.json())
  .then(world=>{
    const countries = topojson.feature(world, world.objects.countries);
    countriesG.selectAll(".country-path")
      .data(countries.features)
      .enter().append("path")
      .attr("class","country-path")
      .attr("d", path)
      .attr("data-iso", d => ISO_N2A[String(d.id).padStart(3,"0")]||"")
      .attr("fill", d => {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")];
        return EMISSIONS[iso] ? colorScale(EMISSIONS[iso]) : "#e4e2dc";
      })
      .on("mouseenter", function(event, d) {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")];
        if (!iso || !EMISSIONS[iso]) return;
        document.getElementById("t-name").textContent = ISO_NAMES[iso]||iso;
        document.getElementById("t-val").textContent = Math.round(EMISSIONS[iso]).toLocaleString()+" Mt CO₂ (2023)";
        tooltip.style.display = "block";
      })
      .on("mousemove", function(event, d) {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")];
        if (!iso || !EMISSIONS[iso]) return;
        pendingEvent = event;
        if (!rafScheduled) { rafScheduled = true; requestAnimationFrame(flushTooltipPosition); }
      })
      .on("mouseleave", () => { tooltip.style.display = "none"; pendingEvent = null; })
      .on("click", function(event, d) {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")] || "";
        showDetail(iso);
      });
  });

const detailPanel = document.getElementById("detail-panel");
const detailBody = document.getElementById("detail-body");

function showDetail(iso) {
  const name = ISO_NAMES[iso] || iso || "This country";
  const stats = COUNTRY_STATS[iso];
  const co2 = EMISSIONS[iso];

  let html = `<div class="detail-name">${name}</div>`;

  if (stats) {
    html += `<div class="detail-grid">
      <div class="detail-cell"><div class="dv">${stats.co2 || (co2 ? Math.round(co2)+" Mt" : "—")}</div><div class="dl">Annual CO2</div></div>
      <div class="detail-cell"><div class="dv">${stats.share || "—"}</div><div class="dl">Share of global emissions</div></div>
      <div class="detail-cell"><div class="dv">${stats.historical || "—"}</div><div class="dl">Historical share since 1850</div></div>
      <div class="detail-cell"><div class="dv">${stats.renewable || "—"}</div><div class="dl">Renewable electricity</div></div>
      <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${stats.gdpLoss || "—"}</div><div class="dl">Est. annual GDP loss</div></div>
    </div>`;

    if (stats.deaths) {
      html += `<div class="detail-grid" style="margin-top:10px">
        <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${stats.deaths}</div><div class="dl">Air-pollution deaths per year (${stats.deathsSrc})</div></div>
      </div>`;
    }

    if (stats.city) {
      html += `<div class="detail-grid" style="margin-top:10px">
        <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${stats.city} — ${stats.pm25} µg/m³</div><div class="dl">Most polluted major city, PM2.5 (${stats.citySrc})</div></div>
      </div>`;
    } else if (stats.pm25nat) {
      html += `<div class="detail-grid" style="margin-top:10px">
        <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${stats.pm25nat} µg/m³</div><div class="dl">National average PM2.5 (${stats.pm25natSrc})</div></div>
      </div>`;
    }

    if (stats.status) {
      html += `<p class="detail-empty" style="margin-top:14px;color:#555">${stats.status}</p>`;
    }

    html += `<a class="detail-link" href="${stats.page}">Full country profile →</a>`;
  } else if (co2) {
    html += `<div class="detail-grid">
      <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${Math.round(co2).toLocaleString()} Mt CO₂ (2023)</div><div class="dl">Annual CO2</div></div>
    </div>
    <p class="detail-empty">A full profile with historical share, renewables and estimated GDP loss isn't published for ${name} yet.</p>`;
  } else {
    html += `<p class="detail-empty">No emissions data is published for ${name} yet on this map. <a class="detail-link" href="countries.html" style="margin-top:6px">Browse all countries →</a></p>`;
  }

  detailBody.innerHTML = html;
  detailPanel.classList.add("open");
}

document.getElementById("detail-close").onclick = () => detailPanel.classList.remove("open");

document.getElementById("search").oninput = e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { countriesG.selectAll(".country-path").style("opacity", null); return; }
  countriesG.selectAll(".country-path").style("opacity", function(){
    const iso = this.getAttribute("data-iso");
    const name = (ISO_NAMES[iso]||"").toLowerCase();
    return name.includes(q) ? 1 : 0.1;
  });
};
</script>
</body>
</html>
