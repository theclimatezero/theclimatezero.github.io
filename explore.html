<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Emissions by Country | The Climate Bill</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:#f5f4f0;color:#1a1a18}
.page{min-height:100vh;display:flex;flex-direction:column}

header{padding:1rem 1.5rem;border-bottom:0.5px solid #ddd;display:flex;align-items:center;justify-content:space-between;background:#fff;flex-wrap:wrap;gap:0.75rem}
.logo{font-size:15px;font-weight:500;color:#1a1a18;text-decoration:none}
.logo span{color:#888}
nav{display:flex;gap:1.5rem;font-size:13px;flex-wrap:wrap}
nav a{color:#777;text-decoration:none}
nav a:hover{color:#1a1a18}
nav a.active{color:#1a1a18;font-weight:500}

.hero{padding:1.5rem 1.5rem 1rem;background:#fff;border-bottom:0.5px solid #ddd}
.hero h1{font-size:22px;font-weight:500}

#map-svg-wrap{flex:1;position:relative;overflow:hidden;background:#f0f4f8;min-height:480px}
#map-svg-wrap svg{width:100%;height:100%;display:block}

.below{padding:1.25rem 1.5rem;background:#fff;border-top:0.5px solid #ddd;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.search-wrap{display:flex;align-items:center;gap:8px}
.search-wrap label{font-size:13px;color:#777}
.search-wrap input{padding:6px 12px;font-size:13px;border:0.5px solid #ccc;border-radius:8px;width:200px;background:#fafaf8;color:#1a1a18;outline:none}
.search-wrap input:focus{border-color:#999}
.example{font-size:12px;color:#bbb}

.tooltip{position:absolute;background:#fff;border:0.5px solid #ccc;border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;display:none;z-index:10;min-width:140px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.tooltip .t-name{font-weight:500;font-size:13px;margin-bottom:2px;color:#1a1a18}
.tooltip .t-val{color:#777}

.no-data{fill:#e4e2dc}
.ocean{fill:#d4e4ef}
.graticule{fill:none;stroke:#c0d4e0;stroke-width:0.3}
.country-path{stroke:#fff;stroke-width:0.4;cursor:pointer;transition:opacity 0.12s}
.country-path:hover{stroke:#555;stroke-width:0.8;opacity:0.85}
</style>
</head>
<body>
<div class="page">

  <header>
    <a class="logo" href="https://theclimatebill.github.io/index.html">The Climate<span>Bill</span></a>
    <nav>
      <a href="https://theclimatebill.github.io/explore.html" class="active">Explore</a>
      <a href="https://theclimatebill.github.io/countries.html">Countries</a>
      <a href="https://theclimatebill.github.io/impact.html">Impact</a>
      <a href="https://theclimatebill.github.io/renewable.html">Renewable energy</a>
      <a href="https://theclimatebill.github.io/compare.html">Compare</a>
      <a href="https://theclimatebill.github.io/about.html">About</a>
    </nav>
  </header>

  <div class="hero">
    <h1>We are now in the Anthropocene.</h1>
  </div>

  <div id="map-svg-wrap">
    <svg id="map-svg" viewBox="0 0 960 500" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tooltip" id="tooltip">
      <div class="t-name" id="t-name"></div>
      <div class="t-val" id="t-val"></div>
    </div>
  </div>

  <div class="below">
    <div class="search-wrap">
      <label for="search">Search country</label>
      <input type="text" id="search" placeholder="e.g. India" autocomplete="off">
    </div>
    <span class="example">Try: China, Kenya, Brazil</span>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const EMISSIONS = {
  "CHN":12000,"USA":4900,"IND":2800,"RUS":1800,"JPN":1050,"DEU":620,"KOR":600,
  "CAN":540,"SAU":600,"IRN":700,"GBR":350,"BRA":450,"ZAF":390,"MEX":420,
  "IDN":680,"AUS":370,"TUR":430,"POL":260,"FRA":280,"ITA":310,"THA":260,
  "MYS":250,"ESP":230,"VNM":300,"EGY":250,"PAK":220,"NGA":130,"ARG":170,
  "NLD":140,"BEL":90,"CHL":85,"PHL":150,"COL":100,"UKR":100,"KAZ":240,
  "NOR":37,"SWE":40,"IRL":37,"KEN":18,"BGD":100,"ETH":16,
};

const ISO_N2A = {"004":"AFG","008":"ALB","012":"DZA","024":"AGO","032":"ARG","036":"AUS","040":"AUT","050":"BGD","056":"BEL","068":"BOL","076":"BRA","100":"BGR","116":"KHM","120":"CMR","124":"CAN","152":"CHL","156":"CHN","170":"COL","191":"HRV","203":"CZE","208":"DNK","218":"ECU","818":"EGY","231":"ETH","246":"FIN","250":"FRA","276":"DEU","288":"GHA","300":"GRC","348":"HUN","356":"IND","360":"IDN","364":"IRN","372":"IRL","380":"ITA","392":"JPN","404":"KEN","410":"KOR","398":"KAZ","484":"MEX","528":"NLD","566":"NGA","578":"NOR","586":"PAK","608":"PHL","616":"POL","620":"PRT","643":"RUS","682":"SAU","710":"ZAF","724":"ESP","752":"SWE","756":"CHE","764":"THA","792":"TUR","804":"UKR","826":"GBR","840":"USA","704":"VNM","056":"BEL","152":"CHL","170":"COL","032":"ARG","076":"BRA"};

const ISO_NAMES = {"CHN":"China","USA":"United States","IND":"India","RUS":"Russia","JPN":"Japan","DEU":"Germany","KOR":"South Korea","CAN":"Canada","SAU":"Saudi Arabia","IRN":"Iran","GBR":"United Kingdom","BRA":"Brazil","ZAF":"South Africa","MEX":"Mexico","IDN":"Indonesia","AUS":"Australia","TUR":"Turkey","POL":"Poland","FRA":"France","THA":"Thailand","ITA":"Italy","MYS":"Malaysia","ESP":"Spain","VNM":"Vietnam","EGY":"Egypt","PAK":"Pakistan","NGA":"Nigeria","ARG":"Argentina","NLD":"Netherlands","BEL":"Belgium","CHL":"Chile","PHL":"Philippines","COL":"Colombia","UKR":"Ukraine","KAZ":"Kazakhstan","NOR":"Norway","SWE":"Sweden","IRL":"Ireland","KEN":"Kenya","BGD":"Bangladesh","ETH":"Ethiopia"};

const colorScale = d3.scaleSequential()
  .domain([0, 12000])
  .interpolator(d3.interpolateRgbBasis(["#fef9e7","#f9ca24","#e55039","#6e0707"]));

const svg = d3.select("#map-svg");
const projection = d3.geoNaturalEarth1().scale(153).translate([480,250]);
const path = d3.geoPath().projection(projection);

svg.append("rect").attr("class","ocean").attr("width",960).attr("height",500);
svg.append("path").datum(d3.geoGraticule()()).attr("class","graticule").attr("d",path);
const countriesG = svg.append("g");

const tooltip = document.getElementById("tooltip");

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
  .then(r=>r.json())
  .then(world=>{
    const countries = topojson.feature(world, world.objects.countries);
    countriesG.selectAll(".country-path")
      .data(countries.features)
      .enter().append("path")
      .attr("class","country-path")
      .attr("d", path)
      .attr("data-iso", d => ISO_N2A[String(d.id).padStart(3,"0")]||"")
      .attr("fill", d => {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")];
        return EMISSIONS[iso] ? colorScale(EMISSIONS[iso]) : "#e4e2dc";
      })
      .on("mousemove", function(event, d) {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")];
        if (!iso || !EMISSIONS[iso]) return;
        document.getElementById("t-name").textContent = ISO_NAMES[iso]||iso;
        document.getElementById("t-val").textContent = Math.round(EMISSIONS[iso]).toLocaleString()+" Mt CO₂ (2023)";
        const bbox = document.getElementById("map-svg-wrap").getBoundingClientRect();
        const tx = Math.min(event.clientX - bbox.left + 14, bbox.width - 170);
        const ty = Math.min(event.clientY - bbox.top + 14, bbox.height - 70);
        tooltip.style.left = tx+"px";
        tooltip.style.top = ty+"px";
        tooltip.style.display = "block";
      })
      .on("mouseleave", () => tooltip.style.display = "none");
  });

document.getElementById("search").oninput = e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { countriesG.selectAll(".country-path").style("opacity", null); return; }
  countriesG.selectAll(".country-path").style("opacity", function(){
    const iso = this.getAttribute("data-iso");
    const name = (ISO_NAMES[iso]||"").toLowerCase();
    return name.includes(q) ? 1 : 0.1;
  });
};
</script>
</body>
</html>
