<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900&family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap');
:root{
  --bg:#faf7f0;--surface:#f3ecdd;--surface2:#ebe0c9;--line:rgba(43,38,32,.12);
  --ink:#2b2620;--muted:#6b6353;--sky:#3f8dc4;--sky-deep:#296f9e;--sky-light:#eaf3f9;
  --terracotta:#c9683f;--sand:#d9a86c;--moss:#6f8f52;--clay:#a8552f;
  --serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
  --sp-1:8px;--sp-2:16px;--sp-3:24px;--sp-4:40px;--sp-5:64px;--sp-6:96px;
}
html[data-theme="dark"]{
  --bg:#14120f;--surface:#1c1a16;--surface2:#242019;--line:rgba(255,255,255,.1);
  --ink:#f3ecdd;--muted:#a89f8c;--sky:#5aa3d6;--sky-deep:#7bb8e0;--sky-light:#1c2a33;
  --terracotta:#e08058;--sand:#e0b787;--moss:#8fb56a;--clay:#e0895a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink)}
.page{min-height:100vh;display:flex;flex-direction:column}

header{padding:1rem 1.5rem;border-bottom:0.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-wrap:wrap;gap:var(--sp-2)}
.logo{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);text-decoration:none}
.logo span{color:var(--terracotta)}
nav{display:flex;gap:1.5rem;font-size:13px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none}
nav a:hover{color:var(--ink)}
nav a.active{color:var(--ink);font-weight:500}

.hero{padding:1.5rem 1.5rem 1rem;background:var(--surface);border-bottom:0.5px solid var(--line)}
.hero h1{font-family:var(--serif);font-size:22px;font-weight:700}

#map-svg-wrap{flex:1;position:relative;overflow:hidden;background:var(--sky-light);min-height:480px}
#map-svg-wrap svg{width:100%;height:100%;display:block}

.below{padding:1.25rem 1.5rem;background:var(--surface);border-top:0.5px solid var(--line);display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.search-wrap{display:flex;align-items:center;gap:8px}
.search-wrap label{font-size:13px;color:var(--muted)}
.search-wrap input{padding:6px 12px;font-size:13px;border:0.5px solid var(--line);border-radius:8px;width:200px;background:var(--bg);color:var(--ink);outline:none;font-family:var(--sans)}
.search-wrap input:focus{border-color:var(--sky)}
.example{font-family:var(--mono);font-size:12px;color:var(--muted)}

.tooltip{position:absolute;left:0;top:0;background:var(--surface);border:0.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;display:none;z-index:10;min-width:140px;box-shadow:0 2px 12px rgba(0,0,0,0.08);will-change:transform}
.detail-panel{position:absolute;top:16px;right:16px;bottom:16px;width:280px;max-width:calc(100% - 32px);background:var(--surface);border:0.5px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,0.12);display:none;z-index:20;overflow-y:auto}
.detail-panel.open{display:block}
.detail-close{position:absolute;top:10px;right:12px;background:none;border:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:4px}
.detail-close:hover{color:var(--ink)}
.detail-name{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:2px;padding-right:20px}
.detail-empty{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.detail-cell{background:var(--bg);border-radius:8px;padding:10px}
.detail-cell .dv{font-size:15px;font-weight:600;color:var(--ink)}
.detail-cell .dl{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.detail-link{display:inline-block;margin-top:16px;font-size:13px;color:var(--sky-deep);text-decoration:none;font-weight:500;transition:text-decoration-color .15s}
.detail-link:hover{text-decoration:underline}
.detail-photo{width:calc(100% + 40px);margin:-20px -20px 14px;height:110px;overflow:hidden;position:relative;border-radius:12px 12px 0 0}
.detail-photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(.45) contrast(1.06) brightness(.95)}
.detail-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,18,0) 40%,rgba(20,20,18,.55) 100%),linear-gradient(135deg,rgba(41,111,158,.3),rgba(168,85,47,.26));mix-blend-mode:multiply}
.detail-photo-cap{position:absolute;bottom:6px;left:12px;color:#f3ecdd;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;z-index:1}
@media(max-width:640px){.detail-panel{left:16px;right:16px;width:auto;top:auto;bottom:16px;max-height:60vh}}
.tooltip .t-name{font-weight:500;font-size:13px;margin-bottom:2px;color:var(--ink)}
.tooltip .t-val{color:var(--muted)}

.no-data{fill:#e4e2dc}
.ocean{fill:#d4e4ef}
.graticule{fill:none;stroke:#c0d4e0;stroke-width:0.3}
.country-path{stroke:#fff;stroke-width:0.4;cursor:pointer;transition:opacity 0.12s ease,stroke-width 0.12s ease,filter 0.12s ease;touch-action:manipulation}
.country-path:hover{stroke:#555;stroke-width:0.9;opacity:0.85;filter:brightness(1.12) saturate(1.15)}
#map-svg-wrap svg{will-change:auto}

.theme-btn{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.theme-btn:hover{border-color:var(--sky)}

html[data-theme="dark"] .ocean{fill:#233642}
html[data-theme="dark"] .graticule{stroke:#2a3d47}
html[data-theme="dark"] .no-data{fill:#242019}
html[data-theme="dark"] .country-path{stroke:#14120f}

.globe-toggle-btn{position:absolute;top:14px;left:14px;z-index:15;background:var(--surface);border:0.5px solid var(--line);border-radius:20px;padding:8px 14px;font-family:var(--mono);font-size:12.5px;color:var(--ink);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.globe-toggle-btn:hover{border-color:var(--sky)}
#globe-wrap{position:absolute;inset:0;display:none;background:#05070d}
#globe-wrap.active{display:block}
#globe-wrap .globe-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#889;font-family:var(--mono);font-size:13px}

@media(max-width:640px){
  .hero{padding:1.1rem 1rem 0.8rem}
  .hero h1{font-size:19px}
  .below{padding:1rem}
  .search-wrap{width:100%}
  .search-wrap input{flex:1;width:auto}
  header{padding:0.85rem 1rem}
  nav{gap:0.9rem;font-size:12.5px}
}
</style>
</head>

// Fuller per-country data (CO2, emissions share, historical share,

const COUNTRY_STATS = {"AUS":{"name":"Australia","page":"country-australia.html","co2":"0.39 Gt","share":"1.1%","historical":"1.1%","renewable":"35%","gdpLoss":"0.3% GDP","status":"The world's highest rooftop solar per person and an accelerating grid transition, but also a major coal and gas exporter facing worsening bushfires, including the January 2026 Victorian fires.","deaths":"3,598","deathsSrc":"WHO, 2021"},"BGD":{"name":"Bangladesh","page":"country-bangladesh.html","co2":"0.12 Gt","share":"0.3%","historical":"0.1%","renewable":"5%","gdpLoss":"1.5 to 2% GDP","status":"A world leader in community level adaptation despite minimal resources and near zero historical responsibility. Absorbs heavy losses from floods and cyclones every year.","deaths":"73,416","deathsSrc":"WHO, 2021","city":"Dhaka","pm25":"68.0","citySrc":"IQAir, 2025"},"BRA":{"name":"Brazil","page":"country-brazil.html","co2":"0.47 Gt","share":"1.3%","historical":"1.3%","renewable":"89%","gdpLoss":"0.5% GDP","status":"One of the cleanest power grids in the world, but land use and deforestation drive large emissions. Amazon deforestation has fallen sharply since 2023, while 2024 drought fuelled the largest Amazon fires since 2005.","deaths":"88,548","deathsSrc":"WHO, 2021"},"CAN":{"name":"Canada","page":"country-canada.html","co2":"0.54 Gt","share":"1.5%","historical":"2%","renewable":"67%","gdpLoss":"0.3% GDP","status":"A largely clean grid from hydro, but among the highest emissions per person in the world due to oil sands production, which continues to expand. Wildfire seasons are worsening dramatically.","deaths":"7,657","deathsSrc":"WHO, 2021","city":"Flin Flon, Manitoba","pm25":"24.0","citySrc":"IQAir, 2025"},"CHN":{"name":"China","page":"country-china.html","co2":"11.4 Gt","share":"31%","historical":"14%","renewable":"31%","gdpLoss":"0.5 to 1% GDP","status":"Installs more solar and wind than the rest of the world combined and leads global EV production. But it still builds new coal plants and remains the largest emitter by far. The direction is right, the pace is contested.","deaths":"1,284,182","deathsSrc":"WHO, 2021","city":"Hotan","pm25":"109.6","citySrc":"IQAir, 2025"},"DNK":{"name":"Denmark","page":"country-denmark.html","co2":"0.028 Gt","share":"0.08%","historical":"0.3%","renewable":"87%","gdpLoss":"0.1% GDP","status":"A global pioneer of offshore wind with one of the most ambitious 2030 targets anywhere, and an exporter of clean energy expertise worldwide.","deaths":"1,558","deathsSrc":"WHO, 2021","pm25nat":"8.2","pm25natSrc":"IQAir, 2025 national average"},"EGY":{"name":"Egypt","page":"country-egypt.html","co2":"0.25 Gt","share":"0.7%","historical":"0.5%","renewable":"12%","gdpLoss":"0.5% GDP","status":"Hosted COP27 and champions African climate finance, but its own grid remains gas dominated. The Nile Delta is highly exposed to sea level rise.","deaths":"63,479","deathsSrc":"WHO, 2021","city":"Cairo","pm25":"40.8","citySrc":"IQAir, 2025"},"ETH":{"name":"Ethiopia","page":"country-ethiopia.html","co2":"0.02 Gt","share":"0.06%","historical":"0.1%","renewable":"99%","gdpLoss":"3 to 5% GDP","status":"Nearly all electricity is renewable, mostly hydropower. One of the lowest emitting nations on Earth, yet repeatedly hit by drought and food insecurity affecting millions.","deaths":"24,517","deathsSrc":"WHO, 2021"},"FRA":{"name":"France","page":"country-france.html","co2":"0.28 Gt","share":"0.8%","historical":"2.3%","renewable":"27%","gdpLoss":"0.15% GDP","status":"A low carbon grid thanks to nuclear power, with growing wind and solar. Faced severe heatwaves in 2026. Renewable expansion has been slower than in Germany or Spain.","deaths":"17,236","deathsSrc":"WHO, 2021","pm25nat":"9.6","pm25natSrc":"IQAir, 2025 national average"},"DEU":{"name":"Germany","page":"country-germany.html","co2":"0.6 Gt","share":"1.7%","historical":"5.5%","renewable":"52%","gdpLoss":"0.2% GDP","status":"Over half of electricity now comes from renewables and coal is being phased out. A significant climate finance contributor with one of the earlier net zero targets among major economies.","deaths":"39,017","deathsSrc":"WHO, 2021","pm25nat":"9.4","pm25natSrc":"IQAir, 2025 national average"},"IND":{"name":"India","page":"country-india.html","share":"8%","historical":"3.5%","gdpLoss":"1.5 to 2%","status":"Massive solar expansion and among the cheapest solar power in the world. Coal still dominates and emissions rise with growth, but emissions per person remain far below Western levels. Highly exposed to heat and floods.","deaths":"936,093","deathsSrc":"WHO, 2021","city":"Loni","pm25":"112.5","citySrc":"IQAir, 2025"},"IDN":{"name":"Indonesia","page":"country-indonesia.html","co2":"0.47 Gt","share":"1.3%","historical":"1.2%","renewable":"19%","gdpLoss":"1 to 2% GDP","status":"Coal supplies about 60 percent of electricity and deforestation remains significant, factors that worsened the deadly December 2025 floods. A 20 billion dollar Just Energy Transition Partnership targets its coal fleet.","deaths":"103,142","deathsSrc":"WHO, 2021","city":"South Tangerang","pm25":"51.5","citySrc":"IQAir, 2025"},"ITA":{"name":"Italy","page":"country-italy.html","co2":"0.31 Gt","share":"0.85%","historical":"2%","renewable":"39%","gdpLoss":"0.3% GDP","status":"Strong solar base and a coal phase out nearly complete. The Mediterranean region is a climate hotspot, exposing Italy to severe heat, drought and flooding.","deaths":"30,265","deathsSrc":"WHO, 2021","pm25nat":"13.3","pm25natSrc":"IQAir, 2025 national average"},"JPN":{"name":"Japan","page":"country-japan.html","co2":"1.0 Gt","share":"3%","historical":"4%","renewable":"24%","gdpLoss":"0.4% GDP","status":"Emissions are declining and solar has expanded significantly, but Japan remains heavily reliant on imported coal and gas. Its hydrogen investment is world leading.","deaths":"50,584","deathsSrc":"WHO, 2021"},"KEN":{"name":"Kenya","page":"country-kenya.html","co2":"0.02 Gt","share":"0.06%","historical":"0.1% const colorScale = d3.scaleSequential()
  .domain([0, 12000])
  .interpolator(d3.interpolateRgbBasis(["#fef9e7","#f9ca24","#e55039","#6e0707"]));

const svg = d3.select("#map-svg");
const projection = d3.geoNaturalEarth1().scale(153).translate([480,250]);
const path = d3.geoPath().projection(projection);

svg.append("rect").attr("class","ocean").attr("width",960).attr("height",500);
svg.append("path").datum(d3.geoGraticule()()).attr("class","graticule").attr("d",path);
const countriesG = svg.append("g");

const tooltip = document.getElementById("tooltip");
const mapWrap = document.getElementById("map-svg-wrap");

// Cache the wrapper's bounding rect instead of reading layout on every
// mousemove (that forces a synchronous reflow each time and is the main
// source of the map feeling laggy). Re-measure only on resize.
let wrapRect = mapWrap.getBoundingClientRect();
window.addEventListener("resize", () => { wrapRect = mapWrap.getBoundingClientRect(); }, { passive: true });

// Throttle tooltip repositioning to one update per animation frame, and
// move it with a GPU-friendly transform instead of left/top so the
// browser doesn't have to re-layout on every pointer move.
let pendingEvent = null;
let rafScheduled = false;
function flushTooltipPosition() {
  rafScheduled = false;
  if (!pendingEvent) return;
  const tx = Math.min(pendingEvent.clientX - wrapRect.left + 14, wrapRect.width - 170);
  const ty = Math.min(pendingEvent.clientY - wrapRect.top + 14, wrapRect.height - 70);
  tooltip.style.transform = `translate(${tx}px, ${ty}px)`;
}

fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
  .then(r=>r.json())
  .then(world=>{
    const countries = topojson.feature(world, world.objects.countries);
    countriesG.selectAll(".country-path")
      .data(countries.features)
      .enter().append("path")
      .attr("class","country-path")
      .attr("d", path)
      .attr("data-iso", d => ISO_N2A[String(d.id).padStart(3,"0")]||"")
      .attr("fill", d => {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")];
        return EMISSIONS[iso] ? colorScale(EMISSIONS[iso]) : "#e4e2dc";
      })
      .on("mouseenter", function(event, d) {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")];
        if (!iso || !EMISSIONS[iso]) return;
        document.getElementById("t-name").textContent = ISO_NAMES[iso]||iso;
        document.getElementById("t-val").textContent = Math.round(EMISSIONS[iso]).toLocaleString()+" Mt CO₂ (2023)";
        tooltip.style.display = "block";
      })
      .on("mousemove", function(event, d) {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")];
        if (!iso || !EMISSIONS[iso]) return;
        pendingEvent = event;
        if (!rafScheduled) { rafScheduled = true; requestAnimationFrame(flushTooltipPosition); }
      })
      .on("mouseleave", () => { tooltip.style.display = "none"; pendingEvent = null; })
      .on("click", function(event, d) {
        const iso = ISO_N2A[String(d.id).padStart(3,"0")] || "";
        showDetail(iso);
      })
      .on("touchstart", function(event, d) {
        // On touch devices there's no hover, so show the name/value
        // tooltip briefly on first tap, then let the click handler above
        // open the full detail panel.
        const iso = ISO_N2A[String(d.id).padStart(3,"0")];
        if (!iso || !EMISSIONS[iso]) return;
        document.getElementById("t-name").textContent = ISO_NAMES[iso]||iso;
        document.getElementById("t-val").textContent = Math.round(EMISSIONS[iso]).toLocaleString()+" Mt CO₂ (2023)";
      });
  });

// --- 3D globe view -------------------------------------------------
// A toggleable alternative to the flat map, built on the same real
// EMISSIONS/COUNTRY_STATS data and the same TopoJSON country shapes —
// nothing about the underlying data changes, only how it's viewed.
let globeInstance = null;
let hoveredPolygon = null;
let globeInitPromise = null;
const globeWrap = document.getElementById("globe-wrap");
const globeToggleBtn = document.getElementById("globe-toggle");
let globeActive = false;

function initGlobe() {
  if (globeInitPromise) return globeInitPromise;
  globeWrap.innerHTML = '<div class="globe-loading">Loading globe…</div>';
  globeInitPromise = fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
    .then(r => r.json())
    .then(world => {
      const countries = topojson.feature(world, world.objects.countries);
      globeWrap.innerHTML = "";
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      globeInstance = window.Globe()(globeWrap)
        .globeImageUrl("https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-day.jpg")
        .bumpImageUrl("https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png")
        .backgroundColor("rgba(0,0,0,0)")
        .showAtmosphere(true)
        .atmosphereColor(isDark ? "#5ec8ff" : "#6fc3ff")
        .atmosphereAltitude(0.22)
        .polygonsData(countries.features)
        .polygonAltitude(d => d === hoveredPolygon ? 0.02 : 0.006)
        .polygonCapColor(d => {
          const iso = ISO_N2A[String(d.id).padStart(3, "0")];
          return EMISSIONS[iso] ? colorScale(EMISSIONS[iso]) : (isDark ? "#3a352c" : "#e4e2dc");
        })
        .polygonSideColor(() => isDark ? "rgba(60,55,45,0.4)" : "rgba(180,175,160,0.3)")
        .polygonStrokeColor(() => isDark ? "#12100c" : "#ffffff")
        .polygonLabel(d => {
          const iso = ISO_N2A[String(d.id).padStart(3, "0")];
          if (!iso || !EMISSIONS[iso]) return "";
          return `<div style="background:#fff;color:#222;padding:6px 10px;border-radius:6px;font-size:12.5px;font-family:inherit">
            <b>${ISO_NAMES[iso] || iso}</b><br>${Math.round(EMISSIONS[iso]).toLocaleString()} Mt CO₂ (2023)</div>`;
        })
        .onPolygonClick(d => {
          const iso = ISO_N2A[String(d.id).padStart(3, "0")] || "";
          showDetail(iso);
        })
        .onPolygonHover(d => {
          globeWrap.style.cursor = d ? "pointer" : "grab";
          hoveredPolygon = d;
          globeInstance.polygonAltitude(x => x === hoveredPolygon ? 0.02 : 0.006);
        });

      globeInstance.pointOfView({ altitude: 2.2 }, 0);
      const controls = globeInstance.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.35;
      controls.enableZoom = true;
      // Only pause the auto-rotation for an actual drag (moving the globe
      // around), not for a plain click on a country to open its detail
      // panel — and resume rotating on its own again shortly after a drag
      // ends, rather than staying stopped forever.
      let dragStartX = 0, dragStartY = 0, isDragging = false, resumeTimer = null;
      globeWrap.addEventListener("pointerdown", (e) => {
        dragStartX = e.clientX; dragStartY = e.clientY; isDragging = false;
        clearTimeout(resumeTimer);
      });
      globeWrap.addEventListener("pointermove", (e) => {
        if (Math.abs(e.clientX - dragStartX) > 4 || Math.abs(e.clientY - dragStartY) > 4) {
          isDragging = true;
          controls.autoRotate = false;
        }
      });
      window.addEventListener("pointerup", () => {
        if (isDragging) {
          clearTimeout(resumeTimer);
          resumeTimer = setTimeout(() => { controls.autoRotate = true; }, 2500);
        }
      });

      function sizeGlobe() {
        const r = mapWrap.getBoundingClientRect();
        globeInstance.width(r.width).height(r.height);
      }
      sizeGlobe();
      window.addEventListener("resize", sizeGlobe, { passive: true });
    })
    .catch(() => {
      globeWrap.innerHTML = '<div class="globe-loading">Couldn\'t load the 3D globe. Try the flat map instead.</div>';
    });
  return globeInitPromise;
}

function toggleGlobeView() {
  globeActive = !globeActive;
  if (globeActive) {
    globeWrap.classList.add("active");
    document.getElementById("map-svg").style.display = "none";
    globeToggleBtn.textContent = "🗺️ Flat map";
    initGlobe();
  } else {
    globeWrap.classList.remove("active");
    document.getElementById("map-svg").style.display = "";
    globeToggleBtn.textContent = "🌐 3D Globe";
  }
}

const detailPanel = document.getElementById("detail-panel");
const detailBody = document.getElementById("detail-body");

// Parse the first number(s) out of a stat string like "1.5 to 2% GDP" or
// "36%" and return their average as a plain float. Returns null if nothing
// numeric is found, so callers can skip that axis rather than fake a value.
function parseNum(str) {
  if (!str) return null;
  const matches = String(str).replace(/,/g, "").match(/[\d.]+/g);
  if (!matches) return null;
  const nums = matches.map(Number);
  return nums.reduce((a,b)=>a+b, 0) / nums.length;
}

// A small generative "climate fingerprint": a five-axis radar shape drawn
// directly from a country's own published numbers (historical share,
// current share, renewable %, GDP loss %, deaths), so every country gets a
// unique, data-true mark rather than a stock icon. Missing axes collapse
// to the centre rather than being invented.
function fingerprintSVG(stats) {
  const axes = [
    { key: "historical", max: 25, val: parseNum(stats.historical) },
    { key: "share", max: 31, val: parseNum(stats.share) },
    { key: "renewable", max: 100, val: parseNum(stats.renewable) },
    { key: "gdpLoss", max: 5, val: parseNum(stats.gdpLoss) },
    { key: "deaths", max: 1300000, val: stats.deaths ? parseNum(stats.deaths) : null },
  ];
  const cx = 45, cy = 45, r = 36;
  const pts = axes.map((a, i) => {
    const frac = a.val === null ? 0 : Math.min(a.val / a.max, 1);
    const angle = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
    return [cx + Math.cos(angle) * r * frac, cy + Math.sin(angle) * r * frac];
  });
  const poly = pts.map(p => p.join(",")).join(" ");
  // Colour reads from the data itself: greener with more renewables,
  // warmer with a larger historical emissions share.
  const renewFrac = Math.min((parseNum(stats.renewable) || 0) / 100, 1);
  const histFrac = Math.min((parseNum(stats.historical) || 0) / 25, 1);
  const hue = 150 - histFrac * 130 + renewFrac * 20; // green -> orange/red
  const fill = `hsl(${Math.round(hue)}, 62%, ${52 + renewFrac*10}%)`;
  return `<svg viewBox="0 0 90 90" width="72" height="72" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".12"/>
    <polygon points="${poly}" fill="${fill}" fill-opacity=".55" stroke="${fill}" stroke-width="1.5"/>
  </svg>`;
}

function showDetail(iso) {
  const name = ISO_NAMES[iso] || iso || "This country";
  const stats = COUNTRY_STATS[iso];
  const co2 = EMISSIONS[iso];

  // Country profile pages already carry a real header photo of a place in
  // that country (header-<slug>.jpg); reuse the same image here so a real
  // place, not just numbers, appears the moment its data is shown.
  const photoSlug = stats && stats.page ? stats.page.replace("country-", "").replace(".html", "") : null;
  const photoHtml = photoSlug
    ? `<div class="detail-photo"><img src="header-${photoSlug}.jpg" alt="A place in ${name}" loading="lazy"><span class="detail-photo-cap">${name}</span></div>`
    : "";

  let html = photoHtml + (stats
    ? `<div style="display:flex;align-items:center;gap:14px;margin-bottom:2px">
        ${fingerprintSVG(stats)}
        <div><div class="detail-name" style="margin-bottom:0">${name}</div>
        <button class="detail-link" style="background:none;border:none;cursor:pointer;padding:0;font-family:inherit;margin-top:4px" onclick="sonifyCountry('${iso}')">🔊 Hear this country's data</button></div>
      </div>`
    : `<div class="detail-name">${name}</div>`);

  if (stats) {
    html += `<div class="detail-grid">
      <div class="detail-cell"><div class="dv">${stats.co2 || (co2 ? Math.round(co2)+" Mt" : "—")}</div><div class="dl">Annual CO2</div></div>
      <div class="detail-cell"><div class="dv">${stats.share || "—"}</div><div class="dl">Share of global emissions</div></div>
      <div class="detail-cell"><div class="dv">${stats.historical || "—"}</div><div class="dl">Historical share since 1850</div></div>
      <div class="detail-cell"><div class="dv">${stats.renewable || "—"}</div><div class="dl">Renewable electricity</div></div>
      <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${stats.gdpLoss || "—"}</div><div class="dl">Est. annual GDP loss</div></div>
    </div>`;

    if (stats.deaths) {
      html += `<div class="detail-grid" style="margin-top:10px">
        <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${stats.deaths}</div><div class="dl">Air-pollution deaths per year (${stats.deathsSrc})</div></div>
      </div>`;
    }

    if (stats.city) {
      html += `<div class="detail-grid" style="margin-top:10px">
        <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${stats.city} — ${stats.pm25} µg/m³</div><div class="dl">Most polluted major city, PM2.5 (${stats.citySrc})</div></div>
      </div>`;
    } else if (stats.pm25nat) {
      html += `<div class="detail-grid" style="margin-top:10px">
        <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${stats.pm25nat} µg/m³</div><div class="dl">National average PM2.5 (${stats.pm25natSrc})</div></div>
      </div>`;
    }

    if (stats.status) {
      html += `<p class="detail-empty" style="margin-top:14px;color:#555">${stats.status}</p>`;
    }

    html += `<a class="detail-link" href="${stats.page}">Full country profile →</a>
    <button class="detail-link" style="background:none;border:none;cursor:pointer;margin-left:14px;font-family:inherit" onclick="copyShareLink()">🔗 Copy link</button>`;
  } else if (co2) {
    html += `<div class="detail-grid">
      <div class="detail-cell" style="grid-column:1 / -1"><div class="dv">${Math.round(co2).toLocaleString()} Mt CO₂ (2023)</div><div class="dl">Annual CO2</div></div>
    </div>
    <p class="detail-empty">A full profile with historical share, renewables and estimated GDP loss isn't published for ${name} yet.</p>`;
  } else {
    html += `<p class="detail-empty">No emissions data is published for ${name} yet on this map. <a class="detail-link" href="countries.html" style="margin-top:6px">Browse all countries →</a></p>`;
  }

  detailBody.innerHTML = html;
  detailPanel.classList.add("open");

  // Make every country view shareable: reflect it in the URL so a link
  // like explore.html?country=IND opens straight to that panel.
  const url = new URL(window.location);
  url.searchParams.set("country", iso);
  window.history.replaceState({}, "", url);
}

document.getElementById("detail-close").onclick = () => {
  detailPanel.classList.remove("open");
  const url = new URL(window.location);
  url.searchParams.delete("country");
  window.history.replaceState({}, "", url);
};

// On load, open straight to a shared country if one is in the URL.
(function openFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const iso = params.get("country");
  if (iso && (COUNTRY_STATS[iso] || EMISSIONS[iso])) {
    setTimeout(() => showDetail(iso), 400);
  }
})();

document.getElementById("search").oninput = e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { countriesG.selectAll(".country-path").style("opacity", null); return; }
  countriesG.selectAll(".country-path").style("opacity", function(){
    const iso = this.getAttribute("data-iso");
    const name = (ISO_NAMES[iso]||"").toLowerCase();
    return name.includes(q) ? 1 : 0.1;
  });
};

function toggleTheme(){
  var html=document.documentElement;
  var isDark=html.getAttribute('data-theme')==='dark';
  if(isDark){html.removeAttribute('data-theme');localStorage.setItem('cb-theme','light');}
  else{html.setAttribute('data-theme','dark');localStorage.setItem('cb-theme','dark');}
}

// Turns a country's own five headline stats into a short sequence of
// tones, so its data profile can be heard as well as read. Each stat is
// normalised to the same 0-1 scale used in the fingerprint above and
// mapped to a pitch between 220Hz and 880Hz; nothing here is decorative
// noise, every note corresponds to a real published number.
let audioCtx;
function sonifyCountry(iso) {
  const stats = COUNTRY_STATS[iso];
  if (!stats) return;
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const axes = [
    { label: "Historical share", val: parseNum(stats.historical), max: 25 },
    { label: "Current share", val: parseNum(stats.share), max: 31 },
    { label: "Renewable electricity", val: parseNum(stats.renewable), max: 100 },
    { label: "GDP loss", val: parseNum(stats.gdpLoss), max: 5 },
    { label: "Air pollution deaths", val: stats.deaths ? parseNum(stats.deaths) : null, max: 1300000 },
  ];
  const now = audioCtx.currentTime;
  axes.forEach((a, i) => {
    const frac = a.val === null ? 0.02 : Math.min(a.val / a.max, 1);
    const freq = 220 + frac * 660;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    const t0 = now + i * 0.32;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.18, t0 + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.32);
  });
}

function copyShareLink(){
  navigator.clipboard.writeText(window.location.href).then(()=>{
    const btn = event.target;
    const old = btn.textContent;
    btn.textContent = "✓ Copied";
    setTimeout(()=>{ btn.textContent = old; }, 1500);
  }).catch(()=>{});
}
