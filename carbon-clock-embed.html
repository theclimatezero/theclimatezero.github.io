<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1.5°C Carbon Clock</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#14120f;color:#f3ecdd;font-family:'Inter',system-ui,sans-serif;padding:20px}
.clock-widget{text-align:center}
.clock-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#7bb8e0;margin-bottom:12px}
.clock-digits{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.clock-unit{min-width:52px}
.clock-num{font-family:'Fraunces',serif;font-weight:900;font-size:1.7rem;line-height:1;color:#f3ecdd}
.clock-lab{font-family:'IBM Plex Mono',monospace;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:#a89f8c;margin-top:3px}
.clock-bar{height:6px;background:#2a251e;border-radius:3px;overflow:hidden;margin:14px auto 8px;max-width:340px}
.clock-bar-fill{height:100%;background:linear-gradient(90deg,#8fb56a,#e0b787,#e0895a)}
.clock-sub{font-size:.7rem;color:#c9c2b0;line-height:1.5;max-width:38ch;margin:0 auto}
.clock-src{font-family:'IBM Plex Mono',monospace;font-size:.55rem;color:#7d7565;margin-top:10px}
.clock-src a{color:#7bb8e0;text-decoration:none}
</style>
</head>
<body>
<div class="clock-widget">
  <div class="clock-eyebrow">Remaining carbon budget, 1.5°C</div>
  <div class="clock-digits" id="clockDigits"></div>
  <div class="clock-bar"><div class="clock-bar-fill" id="clockBar" style="width:0%"></div></div>
  <div class="clock-sub">Runs out around <strong id="clockDate">—</strong> at current emission rates.</div>
  <div class="clock-src">Source: <a href="https://theclimatezero.github.io/carbon-clock.html" target="_blank">ClimateZero</a>, from IPCC AR6</div>
</div>
<script>
const BUDGET_START_TONNES = 500e9;
const BUDGET_START_DATE = new Date("2020-01-01T00:00:00Z");
const ANNUAL_EMISSIONS_TONNES = 36.8e9;
const TONNES_PER_MS = ANNUAL_EMISSIONS_TONNES / (365.25*24*60*60*1000);
function computeRemaining(){
  const elapsedMs = Date.now() - BUDGET_START_DATE.getTime();
  const used = elapsedMs * TONNES_PER_MS;
  const remaining = Math.max(BUDGET_START_TONNES - used, 0);
  const msLeft = remaining / TONNES_PER_MS;
  const depletionDate = new Date(Date.now() + msLeft);
  return { msLeft, depletionDate, pctUsed: (used/BUDGET_START_TONNES)*100 };
}
function fmtDuration(ms){
  const totalSec = Math.floor(ms/1000);
  const years = Math.floor(totalSec/(365.25*24*3600));
  let rem = totalSec - years*365.25*24*3600;
  const days = Math.floor(rem/(24*3600)); rem -= days*24*3600;
  const hours = Math.floor(rem/3600); rem -= hours*3600;
  const mins = Math.floor(rem/60);
  const secs = Math.floor(rem - mins*60);
  return {years, days, hours, mins, secs};
}
function tickClock(){
  const { msLeft, depletionDate, pctUsed } = computeRemaining();
  const d = fmtDuration(msLeft);
  document.getElementById("clockDigits").innerHTML = `
    <div class="clock-unit"><div class="clock-num">${d.years}</div><div class="clock-lab">Yrs</div></div>
    <div class="clock-unit"><div class="clock-num">${d.days}</div><div class="clock-lab">Days</div></div>
    <div class="clock-unit"><div class="clock-num">${d.hours}</div><div class="clock-lab">Hrs</div></div>
    <div class="clock-unit"><div class="clock-num">${String(d.mins).padStart(2,'0')}</div><div class="clock-lab">Min</div></div>
    <div class="clock-unit"><div class="clock-num">${String(d.secs).padStart(2,'0')}</div><div class="clock-lab">Sec</div></div>
  `;
  document.getElementById("clockBar").style.width = Math.min(pctUsed,100).toFixed(2)+"%";
  document.getElementById("clockDate").textContent = depletionDate.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
}
tickClock();
setInterval(tickClock, 1000);
</script>
</body>
</html>
